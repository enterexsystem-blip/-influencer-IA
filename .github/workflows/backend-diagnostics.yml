name: Backend diagnostics

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "media/audios/**"
      - ".github/workflows/backend-diagnostics.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "media/audios/**"
      - ".github/workflows/backend-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Validate Ayla backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: backend
        run: |
          node --check server.js
          node --check local-responses.js
          node --check local-responses-v2.js

      - name: Run regression tests
        working-directory: backend
        run: npm test

      - name: Build diagnostic report
        working-directory: backend
        env:
          DIAGNOSTICS_REPORT_PATH: diagnostics-report.json
        run: node scripts/diagnose.js

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayla-backend-diagnostics
          path: backend/diagnostics-report.json
          if-no-files-found: warn
          retention-days: 14
