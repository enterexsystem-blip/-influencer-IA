databases:
  - name: influencer-ia-memory
    databaseName: influencer_ia
    user: influencer_ia
    plan: free

services:
  - type: web
    name: influencer-ia-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v26.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: KYODAI_TELEGRAM_USER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: influencer-ia-memory
          property: connectionString
