databases:
  - name: influencer-ia-memory
    databaseName: influencer_ia
    user: influencer_ia
    plan: free

services:
  - type: web
    name: influencer-ia-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: influencer-ia-memory
          property: connectionString
